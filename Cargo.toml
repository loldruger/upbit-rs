[package]
name = "upbit"
version = "1.15.0"
edition = "2024"
authors = ["sy september <loldruger@gmail.com>"]
description = "rust_upbit_api for upbit api version v1.5.7"
repository = "https://github.com/loldruger/rust-upbit-api.git"
documentation = "https://docs.rs/upbit/latest/upbit/index.html"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
reqwest = { version = "0.12.16", features = ["json"] }
hmac = "0.12.1"
jsonwebtokens = "1.2.0"
sha2 = "0.10.9"
uuid = { version = "1.17.0", features = ["v4", "serde"] }
serde = "1.0.219"
serde_with = { version = "3.12.0", features = ["json"] }
serde_json = "1.0.140"
envmnt = "0.10.4"
dotenv = "0.15.0"

chrono = { version = "0.4.41", features = ["serde"], optional = true }
sqlx = { version = "0.8.6", optional = true }

[dev-dependencies]
tokio = { version = "1.45.1", features = ["full"] }

[lib]
doctest = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
sqlx-type = ["sqlx"]
chrono-type = ["chrono"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
debug = true
overflow-checks = true